<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musiq Player</title>
<style>
  @font-face {
    font-family: 'Fraunces-fallback';
    src: local('Georgia');
  }
  :root{
    --bg: #17181A;
    --panel: #1F2123;
    --panel-raised: #26282B;
    --cream: #F1ECE2;
    --cream-dim: #9C9891;
    --amber: #E3A94C;
    --rust: #B4552F;
    --olive: #6E7259;
    --line: #35373A;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(227,169,76,0.04), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(180,85,47,0.05), transparent 40%);
    color: var(--cream);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 28px 14px 60px;
  }
  .device{
    width:100%;
    max-width: 980px;
  }
  .app-shell{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap: 22px;
    flex-wrap: wrap;
  }
  .music-col,
  .video-col{
    width: 100%;
    max-width: 460px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 18px;
    padding: 0 4px;
  }
  .brand .name{
    font-size: 22px;
    letter-spacing: 0.5px;
    color: var(--cream);
  }
  .brand .tag{
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--cream-dim);
    letter-spacing: 1px;
  }

  .panel{
    background: linear-gradient(180deg, var(--panel-raised), var(--panel));
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.03);
  }

  /* Reel / artwork zone */
  .stage{
    position: relative;
    height: 200px;
    border-radius: 12px;
    overflow: hidden;
    background: radial-gradient(circle at center, #22201C 0%, #16151300 70%), #1A1918;
    border: 1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom: 18px;
  }
  .art-layer{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(0,0,0,0.18);
    z-index: 1;
    overflow:hidden;
    border-radius: 12px;
  }
  .art-layer img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    background:#161513;
  }
  .art-layer img.visible{ display:block; }
  .art-layer canvas#viz{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    opacity:0.9;
    z-index: 2;
    pointer-events:none;
  }
  .reel{
    width: 130px; height:130px;
    border-radius:50%;
    background:
      radial-gradient(circle at center, #0000 0 20px, var(--line) 21px 22px, transparent 23px),
      conic-gradient(from 0deg, #2A2C2E 0deg 8deg, #232527 8deg 16deg);
    border: 6px solid #2A2C2E;
    position: relative;
    display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
    z-index: 3;
  }
  .reel::after{
    content:'';
    width: 34px; height:34px;
    border-radius:50%;
    background: var(--amber);
    box-shadow: 0 0 0 4px #1A1918, 0 0 14px rgba(227,169,76,0.5);
  }
  .reel.spin{ animation: spin 5s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* Visualizer */
  canvas#viz{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity: 0.9;
  }

  .meta{
    text-align:center;
    margin-bottom: 16px;
    min-height: 48px;
  }
  .meta .title{
    font-size: 19px;
    color: var(--cream);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .meta .sub{
    font-family:'Courier New', monospace;
    font-size: 11px;
    color: var(--cream-dim);
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  /* Scrub bar */
  .scrub{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .scrub time{
    font-family:'Courier New', monospace;
    font-size: 11px;
    color: var(--cream-dim);
    width: 38px;
    flex-shrink:0;
  }
  .scrub time.end{ text-align:right; }
  input[type=range]{
    -webkit-appearance:none;
    appearance:none;
    flex:1;
    height: 4px;
    border-radius: 3px;
    background: var(--line);
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width: 13px; height:13px;
    border-radius:50%;
    background: var(--amber);
    cursor:pointer;
    box-shadow: 0 0 0 3px rgba(227,169,76,0.15);
  }
  input[type=range]::-moz-range-thumb{
    width: 13px; height:13px;
    border-radius:50%;
    background: var(--amber);
    border:none;
    cursor:pointer;
  }
  #seek{
    background: linear-gradient(90deg, var(--rust) 0%, var(--amber) var(--pct,0%), var(--line) var(--pct,0%));
  }

  /* Transport */
  .transport{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 18px;
    margin-bottom: 18px;
  }
  .transport button{
    background:none;
    border:none;
    color: var(--cream);
    cursor:pointer;
    padding: 8px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform 0.15s ease, color 0.15s ease;
  }
  .transport button:hover{ color: var(--amber); transform: translateY(-1px); }
  .transport button:active{ transform: translateY(0px) scale(0.94); }
  .transport svg{ width: 20px; height:20px; }
  #playBtn{
    width: 54px; height:54px;
    border-radius:50%;
    background: linear-gradient(180deg, var(--amber), var(--rust));
    color: #17181A;
  }
  #playBtn:hover{ color:#17181A; }
  #playBtn svg{ width:22px; height:22px; }

  .lowerbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
    padding-top: 4px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  .vol{
    display:flex; align-items:center; gap:8px;
    flex:1;
  }
  .vol svg{ width:15px; height:15px; color: var(--cream-dim); flex-shrink:0; }
  .vol input[type=range]{ height:3px; }
  .modebtn{
    background:none; border: 1px solid var(--line);
    color: var(--cream-dim);
    font-family:'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor:pointer;
    flex-shrink:0;
  }
  .modebtn.active{ color: var(--amber); border-color: var(--amber); }

  /* Playlist */
  .playlist-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin: 22px 4px 10px;
  }
  .playlist-head h2{
    font-size: 13px;
    font-weight:normal;
    letter-spacing: 0.5px;
    color: var(--cream-dim);
    margin:0;
  }
  .upload-label{
    font-family:'Courier New', monospace;
    font-size: 11px;
    color: var(--amber);
    border: 1px dashed var(--rust);
    padding: 6px 12px;
    border-radius: 8px;
    cursor:pointer;
    transition: background 0.15s ease;
  }
  .upload-label:hover{ background: rgba(227,169,76,0.08); }
  #fileInput{ display:none; }

  .empty-state{
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 30px 20px;
    text-align:center;
    color: var(--cream-dim);
    font-size: 13px;
    line-height:1.6;
  }
  .empty-state .big{
    font-size: 15px;
    color: var(--cream);
    margin-bottom: 4px;
  }

  ul#playlist{
    list-style:none;
    margin:0; padding:0;
    max-height: 280px;
    overflow-y:auto;
  }
  ul#playlist li{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 10px 10px;
    border-radius: 8px;
    cursor:pointer;
    border: 1px solid transparent;
  }
  ul#playlist li:hover{ background: rgba(255,255,255,0.03); }
  ul#playlist li.active{
    background: rgba(227,169,76,0.08);
    border-color: rgba(227,169,76,0.25);
  }
  .track-num{
    font-family:'Courier New', monospace;
    font-size: 11px;
    color: var(--cream-dim);
    width: 20px;
    flex-shrink:0;
  }
  li.active .track-num{ color: var(--amber); }
  .track-info{
    flex:1;
    min-width:0;
  }
  .track-info .t-name{
    font-size: 14px;
    color: var(--cream);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-info .t-dur{
    font-family:'Courier New', monospace;
    font-size: 10px;
    color: var(--cream-dim);
    margin-top: 2px;
  }
  .remove-btn{
    background:none;
    border:none;
    color: var(--cream-dim);
    cursor:pointer;
    opacity: 0.5;
    padding: 4px;
    flex-shrink:0;
  }
  .remove-btn:hover{ color: var(--rust); opacity:1; }
  .remove-btn svg{ width:14px; height:14px; }

  ul#playlist::-webkit-scrollbar{ width: 6px; }
  ul#playlist::-webkit-scrollbar-thumb{ background: var(--line); border-radius:3px; }

  .upload-label{
    font-family:'Courier New', monospace;
    font-size: 11px;
    color: var(--amber);
    border: 1px dashed var(--rust);
    padding: 6px 12px;
    border-radius: 8px;
    cursor:pointer;
    transition: background 0.15s ease;
  }
  .upload-label:hover{ background: rgba(227,169,76,0.08); }
  #fileInput, #folderInput, #videoInput{ display:none; }

  .video-section{
    margin-top: 22px;
    border-top: 1px solid var(--line);
    padding-top: 18px;
  }
  .video-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom: 12px;
  }
  .video-toolbar h2{
    font-size: 13px;
    font-weight:normal;
    letter-spacing: 0.5px;
    color: var(--cream-dim);
    margin:0;
  }
  .video-wrap{
    position:relative;
    width:100%;
    background: #0d0e0f;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow:hidden;
    min-height: 180px;
  }
  .video-wrap video{
    display:block;
    width:100%;
    max-height: 220px;
    background:#050505;
  }
  .video-empty{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color: var(--cream-dim);
    font-family:'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.6px;
    background: rgba(10,10,10,0.6);
  }

  @media (prefers-reduced-motion: reduce){
    .reel.spin{ animation: none; }
  }
</style>
</head>
<body>

<div class="device">
  <div class="brand">
    <span class="name">Musiq Player
    </span>
    <span class="tag">LOCAL PLAYBACK</span>
  </div>

  <div class="app-shell">
    <div class="music-col">
      <div class="panel">
        <div class="stage">
          <canvas id="viz"></canvas>
          <div class="art-layer" id="artLayer">
            <img id="artImage" alt="Album art">
          </div>
          <div class="reel" id="reel"></div>
        </div>

        <div class="meta">
          <div class="title" id="trackTitle"></div>
          <div class="sub" id="trackSub">— : —</div>
        </div>

        <div class="scrub">
          <time id="curTime">0:00</time>
          <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
          <time class="end" id="durTime">0:00</time>
        </div>

        <div class="transport">
          <button id="prevBtn" title="Previous">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l10-6v12z"/></svg>
          </button>
          <button id="playBtn" title="Play/Pause">
            <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          </button>
          <button id="nextBtn" title="Next">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4.5 6l10 6-10 6z"/></svg>
          </button>
        </div>

        <div class="lowerbar">
          <div class="vol">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02z"/></svg>
            <input type="range" id="volume" min="0" max="100" value="70">
          </div>
          <button class="modebtn" id="repeatBtn" title="Repeat">REPEAT</button>
        </div>
      </div>

      <div class="playlist-head">
        <h2>PLAYLIST</h2>
        <div style="display:flex; gap:8px;">
          <label class="upload-label" for="fileInput">+ ADD FILES</label>
        </div>
        <input type="file" id="fileInput" accept="audio/*" multiple>
        <input type="file" id="folderInput" webkitdirectory directory multiple>
      </div>

      <ul id="playlist"></ul>
    </div>

    <div class="video-col">
      <div class="video-section">
        <div class="video-toolbar">
          <h2>VIDEO</h2>
          <label class="upload-label" for="videoInput">+ ADD VIDEO</label>
        </div>
        <input type="file" id="videoInput" accept="video/*">
        <div class="video-wrap">
          <video id="videoPlayer" controls playsinline></video>
          <div class="video-empty" id="videoEmpty">No video loaded</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const audio = new Audio();
  audio.preload = 'metadata';

  let tracks = []; // {id, file, url, name, duration}
  let currentIndex = -1;
  let shuffleOn = false;
  let repeatMode = 0; // 0 off, 1 all, 2 one

  const $ = id => document.getElementById(id);
  const fileInput = $('fileInput');
  const folderInput = $('folderInput');
  const videoInput = $('videoInput');
  const videoPlayer = $('videoPlayer');
  const videoEmpty = $('videoEmpty');
  const playlistEl = $('playlist');
  const playBtn = $('playBtn');
  const playIcon = $('playIcon');
  const pauseIcon = $('pauseIcon');
  const prevBtn = $('prevBtn');
  const nextBtn = $('nextBtn');
  const seek = $('seek');
  const curTime = $('curTime');
  const durTime = $('durTime');
  const trackTitle = $('trackTitle');
  const trackSub = $('trackSub');
  const volume = $('volume');
  const reel = $('reel');
  const artImage = $('artImage');
  const shuffleBtn = $('shuffleBtn');
  const repeatBtn = $('repeatBtn');
  const vizCanvas = $('viz');
  const vizCtx = vizCanvas.getContext('2d');

  audio.volume = 0.7;

  function fmtTime(s){
    if (!isFinite(s) || s < 0) return '0:00';
    const m = Math.floor(s/60);
    const sec = Math.floor(s%60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  }

  function cleanName(filename){
    return filename.replace(/\.[^/.]+$/, '');
  }

  function setArtworkImage(src){
    if (!artImage) return;
    if (!src) {
      artImage.removeAttribute('src');
      artImage.classList.remove('visible');
      reel.style.display = 'flex';
      return;
    }
    artImage.src = src;
    artImage.classList.add('visible');
    reel.style.display = 'none';
  }

  function readBinaryAsBase64(buffer){
    let binary = '';
    const bytes = new Uint8Array(buffer);
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      const slice = bytes.subarray(i, i + chunk);
      binary += String.fromCharCode.apply(null, Array.from(slice));
    }
    return btoa(binary);
  }

  function extractId3Artwork(arrayBuffer){
    const bytes = new Uint8Array(arrayBuffer);
    if (bytes.length < 10 || String.fromCharCode(...bytes.slice(0, 3)) !== 'ID3') return null;

    const major = bytes[3];
    const size = ((bytes[6] & 0x7F) << 21) | ((bytes[7] & 0x7F) << 14) | ((bytes[8] & 0x7F) << 7) | (bytes[9] & 0x7F);
    let offset = 10;
    let end = offset + size;
    if (major === 2 || major === 3) {
      // ID3v2.2/v2.3 frame layout
    }

    while (offset + 10 <= end) {
      const frameId = String.fromCharCode(...bytes.slice(offset, offset + 4));
      if (/^\x00+$/.test(frameId)) break;
      if (frameId === 'APIC' || frameId === 'PIC') {
        let dataOffset = offset + 10;
        let mime = '';
        let mimeEnd = -1;
        let descriptionLen = 0;
        if (frameId === 'APIC') {
          const encoding = bytes[dataOffset];
          dataOffset += 1;
          let j = dataOffset;
          while (j < bytes.length && bytes[j] !== 0) j++;
          mime = new TextDecoder('latin1').decode(bytes.subarray(dataOffset, j));
          dataOffset = j + 1;
          if (encoding === 1 || encoding === 2 || encoding === 3) {
            let k = dataOffset;
            while (k < bytes.length && bytes[k] !== 0) k++;
            descriptionLen = k - dataOffset + 1;
            dataOffset += descriptionLen;
          }
          const start = dataOffset;
          const artData = bytes.subarray(start);
          if (artData.length > 0) {
            const base64 = readBinaryAsBase64(artData.buffer.slice(artData.byteOffset, artData.byteOffset + artData.byteLength));
            return `data:${mime || 'image/jpeg'};base64,${base64}`;
          }
        }

        if (frameId === 'PIC') {
          const picType = bytes[dataOffset + 1];
          const mimeStart = dataOffset + 2;
          let mimeEnd2 = mimeStart;
          while (mimeEnd2 < bytes.length && bytes[mimeEnd2] !== 0) mimeEnd2++;
          mime = new TextDecoder('latin1').decode(bytes.subarray(mimeStart, mimeEnd2));
          const imageStart = mimeEnd2 + 1;
          const artData = bytes.subarray(imageStart);
          if (artData.length > 0) {
            const base64 = readBinaryAsBase64(artData.buffer.slice(artData.byteOffset, artData.byteOffset + artData.byteLength));
            return `data:${mime || 'image/jpeg'};base64,${base64}`;
          }
        }
      }

      const sizeBytes = bytes.slice(offset + 4, offset + 8);
      const frameSize = (sizeBytes[0] << 24) | (sizeBytes[1] << 16) | (sizeBytes[2] << 8) | sizeBytes[3];
      offset += 10 + frameSize;
    }

    return null;
  }

  function loadTrackArtwork(file, track){
    if (!file || !file.type.startsWith('audio/') && !/\.(mp3|wav|m4a|ogg|flac|aac|wma)$/i.test(file.name)) {
      track.artwork = null;
      setArtworkImage(null);
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      const art = extractId3Artwork(reader.result);
      track.artwork = art;
      if (currentIndex !== -1 && tracks[currentIndex] && tracks[currentIndex].id === track.id) {
        setArtworkImage(art);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // ---- File handling ----
  if (fileInput) {
    fileInput.addEventListener('change', (e) => {
      addFiles(e.target.files, false);
      fileInput.value = '';
    });
  }

  if (folderInput) {
    folderInput.addEventListener('change', (e) => {
      addFiles(e.target.files, true);
      folderInput.value = '';
    });
  }

  if (videoInput) {
    videoInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      videoPlayer.src = url;
      videoPlayer.load();
      videoEmpty.style.display = 'none';
      videoInput.value = '';
    });
  }

  function addFiles(fileList, filterAudioOnly){
    let files = Array.from(fileList || []);
    if (filterAudioOnly){
      files = files.filter(f => f.type.startsWith('audio/') || /\.(mp3|wav|m4a|ogg|flac|aac|wma)$/i.test(f.name));
    }
    if (!files.length) return;
    files.forEach(file => {
      const url = URL.createObjectURL(file);
      const track = { id: crypto.randomUUID(), file, url, name: cleanName(file.name), duration: null, artwork: null };
      tracks.push(track);
      loadTrackArtwork(file, track);
      // probe duration
      const probe = new Audio(url);
      probe.addEventListener('loadedmetadata', () => {
        track.duration = probe.duration;
        renderPlaylist();
      });
    });
    renderPlaylist();
    if (currentIndex === -1 && tracks.length){
      loadTrack(0);
    }
  }

  function renderPlaylist(){
    playlistEl.innerHTML = '';
    tracks.forEach((t, i) => {
      const li = document.createElement('li');
      if (i === currentIndex) li.classList.add('active');
      li.innerHTML = `
        <span class="track-num">${(i+1).toString().padStart(2,'0')}</span>
        <span class="track-info">
          <div class="t-name">${escapeHtml(t.name)}</div>
          <div class="t-dur">${t.duration ? fmtTime(t.duration) : '--:--'}</div>
        </span>
        <button class="remove-btn" data-idx="${i}" title="Remove">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </button>
      `;
      li.addEventListener('click', (ev) => {
        if (ev.target.closest('.remove-btn')) return;
        loadTrack(i);
        playAudio();
      });
      li.querySelector('.remove-btn').addEventListener('click', (ev) => {
        ev.stopPropagation();
        removeTrack(i);
      });
      playlistEl.appendChild(li);
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function removeTrack(i){
    const wasCurrent = i === currentIndex;
    URL.revokeObjectURL(tracks[i].url);
    tracks.splice(i, 1);
    if (i < currentIndex) currentIndex--;
    else if (wasCurrent){
      audio.pause();
      currentIndex = -1;
      resetNowPlaying();
      if (tracks.length) loadTrack(Math.min(i, tracks.length - 1));
    }
    renderPlaylist();
  }

  function resetNowPlaying(){
    trackTitle.textContent = 'No track loaded';
    trackSub.textContent = '— : —';
    seek.value = 0;
    curTime.textContent = '0:00';
    durTime.textContent = '0:00';
    reel.classList.remove('spin');
    setArtworkImage(null);
    setPlayIcon(false);
  }

  function loadTrack(i){
    if (i < 0 || i >= tracks.length) return;
    currentIndex = i;
    const t = tracks[i];
    audio.src = t.url;
    trackTitle.textContent = t.name;
    trackSub.textContent = `TRACK ${(i+1).toString().padStart(2,'0')} OF ${tracks.length.toString().padStart(2,'0')}`;
    setArtworkImage(t.artwork || null);
    renderPlaylist();
    updateMediaSessionMetadata(t);
  }

  // ---- Media Session (lock screen / notification controls, background playback) ----
  function updateMediaSessionMetadata(t){
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.name,
      artist: 'Spool',
      album: `Track ${currentIndex + 1} of ${tracks.length}`,
    });
  }

  function setupMediaSessionHandlers(){
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.setActionHandler('play', () => playAudio());
    navigator.mediaSession.setActionHandler('pause', () => pauseAudio());
    navigator.mediaSession.setActionHandler('previoustrack', () => prevBtn.click());
    navigator.mediaSession.setActionHandler('nexttrack', () => nextBtn.click());
    navigator.mediaSession.setActionHandler('stop', () => pauseAudio());
    try {
      navigator.mediaSession.setActionHandler('seekto', (details) => {
        if (details.fastSeek && 'fastSeek' in audio){
          audio.fastSeek(details.seekTime);
          return;
        }
        audio.currentTime = details.seekTime;
      });
      navigator.mediaSession.setActionHandler('seekbackward', (details) => {
        audio.currentTime = Math.max(0, audio.currentTime - (details.seekOffset || 10));
      });
      navigator.mediaSession.setActionHandler('seekforward', (details) => {
        audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + (details.seekOffset || 10));
      });
    } catch (e) { /* some browsers don't support all handlers */ }
  }
  setupMediaSessionHandlers();

  function updatePositionState(){
    if (!('mediaSession' in navigator) || !('setPositionState' in navigator.mediaSession)) return;
    if (!isFinite(audio.duration) || audio.duration <= 0) return;
    try {
      navigator.mediaSession.setPositionState({
        duration: audio.duration,
        playbackRate: audio.playbackRate,
        position: audio.currentTime,
      });
    } catch (e) { /* ignore transient state errors */ }
  }

  // ---- Transport ----
  function setPlayIcon(playing){
    playIcon.style.display = playing ? 'none' : 'block';
    pauseIcon.style.display = playing ? 'block' : 'none';
    reel.classList.toggle('spin', playing);
  }

  function playAudio(){
    if (currentIndex === -1 && tracks.length) loadTrack(0);
    if (currentIndex === -1) return;
    ensureAudioGraph();
    audio.play();
    setPlayIcon(true);
  }
  function pauseAudio(){
    audio.pause();
    setPlayIcon(false);
  }

  playBtn.addEventListener('click', () => {
    if (audio.paused) playAudio(); else pauseAudio();
  });

  prevBtn.addEventListener('click', () => {
    if (!tracks.length) return;
    if (audio.currentTime > 3){ audio.currentTime = 0; return; }
    let i = shuffleOn ? randomIndex() : (currentIndex - 1 + tracks.length) % tracks.length;
    loadTrack(i);
    playAudio();
  });

  nextBtn.addEventListener('click', () => {
    goNext();
  });

  function randomIndex(){
    if (tracks.length <= 1) return 0;
    let i;
    do { i = Math.floor(Math.random() * tracks.length); } while (i === currentIndex);
    return i;
  }

  function goNext(auto){
    if (!tracks.length) return;
    if (repeatMode === 2 && auto){
      audio.currentTime = 0;
      playAudio();
      return;
    }
    let i;
    if (shuffleOn) i = randomIndex();
    else i = currentIndex + 1;

    if (i >= tracks.length){
      if (repeatMode === 1) i = 0;
      else { pauseAudio(); return; }
    }
    loadTrack(i);
    playAudio();
  }

  audio.addEventListener('ended', () => goNext(true));

  audio.addEventListener('timeupdate', () => {
    if (!isFinite(audio.duration)) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    seek.value = pct;
    seek.style.setProperty('--pct', pct + '%');
    curTime.textContent = fmtTime(audio.currentTime);
    updatePositionState();
  });
  audio.addEventListener('loadedmetadata', () => {
    durTime.textContent = fmtTime(audio.duration);
    updatePositionState();
  });
  audio.addEventListener('play', () => {
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
  });
  audio.addEventListener('pause', () => {
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  });

  seek.addEventListener('input', () => {
    if (!isFinite(audio.duration)) return;
    audio.currentTime = (seek.value / 100) * audio.duration;
  });

  volume.addEventListener('input', () => {
    audio.volume = volume.value / 100;
  });

  if (shuffleBtn) {
    shuffleBtn.addEventListener('click', () => {
      shuffleOn = !shuffleOn;
      shuffleBtn.classList.toggle('active', shuffleOn);
    });
  }
  if (repeatBtn) {
    repeatBtn.addEventListener('click', () => {
      repeatMode = (repeatMode + 1) % 3;
      repeatBtn.classList.toggle('active', repeatMode !== 0);
      repeatBtn.textContent = repeatMode === 0 ? 'REPEAT' : repeatMode === 1 ? 'REPEAT ALL' : 'REPEAT ONE';
    });
  }

  // ---- Visualizer ----
  let audioCtx, analyser, sourceNode, dataArray;
  function ensureAudioGraph(){
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    sourceNode = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    requestAnimationFrame(drawViz);
  }

  function resizeCanvas(){
    const rect = vizCanvas.getBoundingClientRect();
    vizCanvas.width = rect.width * devicePixelRatio;
    vizCanvas.height = rect.height * devicePixelRatio;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function drawViz(){
    requestAnimationFrame(drawViz);
    if (!analyser) return;
    analyser.getByteFrequencyData(dataArray);
    const w = vizCanvas.width, h = vizCanvas.height;
    vizCtx.clearRect(0, 0, w, h);
    const barCount = 28;
    const innerPad = 12;
    const maxBarHeight = h * 0.62;
    const gap = 4;
    const barWidth = (w - innerPad * 2 - gap * (barCount - 1)) / barCount;

    for (let i = 0; i < barCount; i++){
      const sample = dataArray[Math.floor((i / barCount) * dataArray.length)] || 0;
      const val = sample / 255;
      const barHeight = Math.max(8, val * maxBarHeight);
      const x = innerPad + i * (barWidth + gap);
      const y = h - barHeight - 12;
      const grad = vizCtx.createLinearGradient(0, h, 0, y);
      grad.addColorStop(0, 'rgba(180,85,47,0.5)');
      grad.addColorStop(0.5, 'rgba(227,169,76,0.75)');
      grad.addColorStop(1, 'rgba(255,230,170,0.95)');
      vizCtx.fillStyle = grad;
      vizCtx.fillRect(x, y, barWidth, barHeight);
    }
  }

  // ---- Keyboard shortcuts ----
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space'){ e.preventDefault(); if (audio.paused) playAudio(); else pauseAudio(); }
    if (e.code === 'ArrowRight'){ nextBtn.click(); }
    if (e.code === 'ArrowLeft'){ prevBtn.click(); }
  });
})();
</script>
</body>
</html>
